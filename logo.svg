<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AceLens — Copyright © 2026 Inban Tamizhselvan. All rights reserved.
       Proprietary and confidential. No copying, redistribution, reverse engineering,
       or use in training any AI model. See LICENSE.txt. -->
  <!-- "Seam lens": a mint-to-ball-yellow tennis ball whose two seams cradle a lens aperture,
       inside an open focus ring, on a deep navy tile. -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0e3443"/>
      <stop offset="0.55" stop-color="#06202b"/>
      <stop offset="1" stop-color="#020d13"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#3df2c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3df2c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1="0.12" y1="0.92" x2="0.88" y2="0.08">
      <stop offset="0" stop-color="#2fe6bf"/>
      <stop offset="0.5" stop-color="#8ff57f"/>
      <stop offset="1" stop-color="#ecff4a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#02121a" stop-opacity="0"/>
      <stop offset="1" stop-color="#02121a" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3df2c4"/>
      <stop offset="1" stop-color="#e6ff3f"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#14465a"/>
      <stop offset="1" stop-color="#03141c"/>
    </radialGradient>
    <clipPath id="ballClip"><circle cx="512" cy="512" r="288"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#tile)"/>
  <rect x="49.5" y="49.5" width="925" height="925" rx="222.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>

  <!-- focus ring: an open mint-to-yellow arc -->
  <circle cx="512" cy="512" r="352" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="1840 372" transform="rotate(-62 512 512)" opacity="0.9"/>
  <circle cx="512" cy="512" r="352" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="22"/>

  <!-- the ball -->
  <g clip-path="url(#ballClip)">
    <circle cx="512" cy="512" r="288" fill="url(#ball)"/>
    <circle cx="512" cy="512" r="288" fill="url(#shine)"/>
    <circle cx="512" cy="512" r="288" fill="url(#shade)"/>
    <g transform="rotate(-24 512 512)">
      <!-- the seams, cradling the lens -->
      <path d="M 282 262 C 452 396 452 628 282 762" fill="none" stroke="#f6fff2" stroke-width="28" stroke-linecap="round"/>
      <path d="M 742 262 C 572 396 572 628 742 762" fill="none" stroke="#f6fff2" stroke-width="28" stroke-linecap="round"/>
    </g>
    <!-- the lens aperture -->
    <circle cx="512" cy="512" r="74" fill="url(#iris)" stroke="#04161f" stroke-width="30"/>
    <circle cx="512" cy="512" r="74" fill="none" stroke="url(#ring)" stroke-width="12"/>
    <circle cx="512" cy="512" r="30" fill="#010a0f"/>
    <circle cx="488" cy="488" r="13" fill="#ffffff" opacity="0.92"/>
  </g>
  <circle cx="512" cy="512" r="287" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
</svg>
